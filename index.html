<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>sach_n_jngd_music</title>
<style>
:root{color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:#0b0d10;color:#f5f7fa;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif}
.wrap{max-width:900px;margin:auto;padding:20px 16px 40px}
.hero{padding:18px 4px 8px}
h1{margin:0;font-size:28px;letter-spacing:-.4px}
.sub{margin:7px 0 0;color:#aab1bb;line-height:1.45}
.search{display:flex;gap:9px;margin:18px 0 10px}
input{min-width:0;flex:1;padding:14px 15px;border:1px solid #343943;border-radius:13px;background:#15181d;color:#fff;font-size:16px;outline:none}
button{padding:0 18px;border:0;border-radius:13px;background:#fff;color:#111;font-weight:800;font-size:15px}
#status{min-height:22px;color:#aab1bb;font-size:14px;margin:8px 2px}
.card{margin-top:12px;background:#13161b;border:1px solid #2b3038;border-radius:16px;padding:15px}
.title{font-size:17px;font-weight:750;line-height:1.35}
.meta{margin-top:6px;color:#aab1bb;font-size:13px;line-height:1.45}
.badge{display:inline-block;margin-top:9px;padding:4px 8px;border-radius:999px;background:#20252d;color:#d8dde5;font-size:12px}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:13px}
a.btn{display:inline-block;text-decoration:none;padding:10px 12px;border-radius:11px;border:1px solid #3a414c;color:#f5f7fa;font-size:14px;font-weight:650}
a.primary{background:#fff;color:#111;border-color:#fff}
.note{margin-top:18px;color:#8f98a4;font-size:13px;line-height:1.55}
.errors{margin-top:10px;color:#ffb4a8;font-size:13px}
.empty{padding:28px 8px;color:#8f98a4;text-align:center}
</style>
</head>
<body>
<div class="wrap">
  <div class="hero">
    <h1>🎵 sach_n_jngd_music</h1>
    <div class="sub">Music discovery across sources that expose public or authorized media.</div>
  </div>

  <div class="search">
    <input id="q" autocomplete="off" placeholder="Song, artist, album..." aria-label="Search music">
    <button id="searchBtn" onclick="go()">Search</button>
  </div>

  <div id="status"></div>
  <div id="errors" class="errors"></div>
  <div id="results"></div>

  <div class="note">
    Direct downloads appear only when the provider exposes the file and its download permission/rights.
    Protected or stream-only commercial music is not bypassed or converted.
  </div>
</div>

<script>
const qEl=document.getElementById("q");
const resultsEl=document.getElementById("results");
const statusEl=document.getElementById("status");
const errorsEl=document.getElementById("errors");
const btn=document.getElementById("searchBtn");

function esc(v){
  return String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c]));
}
function safeUrl(v){
  try{
    const u=new URL(v,location.origin);
    return ["http:","https:"].includes(u.protocol)?u.href:"#";
  }catch{return "#";}
}
function card(x){
  const canDownload=Boolean(x.download);
  const action=canDownload
    ? `<a class="btn primary" href="${safeUrl(x.download)}">${esc(x.download_label||"Open / Download")}</a>`
    : `<span class="badge">Download not enabled by provider</span>`;
  const source=`<a class="btn" target="_blank" rel="noopener" href="${safeUrl(x.source_url)}">Source</a>`;
  const license=x.license?`<div class="meta">Rights / license: ${esc(x.license)}</div>`:"";
  return `<div class="card">
    <div class="title">${esc(x.title||"Untitled")}</div>
    <div class="meta">${esc(x.artist||"Unknown artist")} · ${esc(x.source||"Source")}${x.year?" · "+esc(x.year):""}</div>
    ${license}
    <div class="actions">${action}${source}</div>
  </div>`;
}
async function go(){
  const q=qEl.value.trim();
  if(!q){qEl.focus();return}
  btn.disabled=true;
  statusEl.textContent="Searching…";
  errorsEl.textContent="";
  resultsEl.innerHTML="";
  try{
    const r=await fetch("/api/search?q="+encodeURIComponent(q),{headers:{"Accept":"application/json"}});
    const d=await r.json();
    if(!r.ok) throw new Error("Search request failed");
    const list=d.results||[];
    statusEl.textContent=list.length?`${list.length} results found`:"No results found";
    if(list.length) resultsEl.innerHTML=list.map(card).join("");
    else resultsEl.innerHTML='<div class="empty">Try another song, artist, or genre.</div>';
    if((d.errors||[]).length) errorsEl.textContent=d.errors.join(" · ");
  }catch(e){
    statusEl.textContent="Search failed";
    errorsEl.textContent="Some providers may be temporarily unavailable. Please try again.";
  }finally{
    btn.disabled=false;
  }
}
qEl.addEventListener("keydown",e=>{if(e.key==="Enter")go()});
</script>
</body>
</html>
